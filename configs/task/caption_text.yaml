# @package _global_
defaults:
  - override /dataset: captions

dataset:
  prompt_repeat: 10  # TRAIN split only: prompt words are too rare in captions to be learned otherwise (see CaptionDataset)

spec:
  _target_: semcom.encoders.text.task.TextTask
  model: {d_model: 128, nhead: 8, num_layers: 3, dim_ff: 512, dropout: 0.1, symbols_per_token: 16}
  tokenizer: {max_vocab: 20000, min_freq: 3, max_len: 40, required_prompts: true, prompt_root: "${data_root}"}
  eval: ${eval}

train:
  epochs: 10
  batch_size: 128
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_frac: 0.05
  grad_clip: 1.0
  snr_range_db: [0, 25]
  val_snr_db: 10
  log_every: 50
  num_workers: 0
  max_steps_per_epoch: null  # cap for smoke runs/benchmarks

eval:
  snr_grid_db: [0, 5, 10, 15, 20, 25]
  max_items: 2000
  batch_size: 250
