# @package _global_
# ESC-50 event audio: folds 1-3 train, fold 4 validation (checkpoint selection), fold 5 test (reported only)
defaults:
  - override /dataset: esc50

spec:
  _target_: semcom.encoders.audio.task.AudioReconTask
  model: {frame_len: 128, channels: 128, num_blocks: 4, symbols_per_frame: 64, kernel: 5}
  eval: ${eval}

train:
  epochs: 80
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 200
  min_lr_frac: 0.05
  grad_clip: 1.0
  snr_range_db: [0, 25]
  val_snr_db: 10
  log_every: 25
  num_workers: 0
  max_steps_per_epoch: null  # cap for smoke runs/benchmarks

eval:
  snr_grid_db: [0, 5, 10, 15, 20, 25]
  max_items: 400
  batch_size: 25
  pesq: false  # speech-only
  stoi: false  # speech-intelligibility metric; not meaningful for event audio
  lsd: true
  scale_fit_items: 300
