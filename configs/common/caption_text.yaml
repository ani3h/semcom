# @package _global_
task: caption_text
dataset_name: captions
dataset_overrides: {prompt_repeat: 0}  # heads and anchors never see the class prompts the transceiver was trained on

head: {kind: text_attention, sym_dim: 16, d_model: 256, nhead: 4, ff: 512, max_len: 64, dropout: 0.1}
loss: {init_temp: 0.07, min_temp: 0.01, max_temp: 0.5, cos_weight: 0.5}

train:
  epochs: 20
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 200
  min_lr_frac: 0.05
  grad_clip: 1.0
  snr_range_db: [0, 25]
  val_snr_db: 10
  val_batches: 10
  log_every: 20
  sigma_items: 2000

eval:
  snr_grid_db: [0, 5, 10, 15, 20, 25]
  batch_size: 250
  max_items: 1000
  seed: 1234
  prompts: null
