# @package _global_
task: audio
dataset_name: edinburgh_audio

head: {kind: audio_conv, frame_dim: 64, hidden: 256, kernel: 5, dropout: 0.1}
loss: {init_temp: 0.07, min_temp: 0.01, max_temp: 0.5, cos_weight: 0.5}

train:
  epochs: 30
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 100
  min_lr_frac: 0.05
  grad_clip: 1.0
  snr_range_db: [0, 25]
  val_snr_db: 10
  val_batches: 10
  log_every: 20
  sigma_items: 2000

eval:
  snr_grid_db: [0, 5, 10, 15, 20, 25]
  batch_size: 100
  max_items: null  # all 824 test utterances (centre 1 s crops)
  seed: 1234
  prompts: null
