# @package _global_
# ESC-50 event audio: heads train on folds 1-3 only, fold 4 selects the checkpoint, fold 5 is never touched during training.
task: esc50_audio
dataset_name: esc50

head: {kind: audio_conv, frame_dim: 64, hidden: 256, kernel: 5, dropout: 0.1}
loss: {init_temp: 0.07, min_temp: 0.01, max_temp: 0.5, cos_weight: 0.5}

train:
  epochs: 100  # only 1200 training clips, so many short epochs; the channel noise differs on every pass
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 100
  min_lr_frac: 0.05
  grad_clip: 1.0
  snr_range_db: [0, 25]
  val_snr_db: 10
  val_batches: 6
  log_every: 6
  sigma_items: 300

eval:
  snr_grid_db: [0, 5, 10, 15, 20, 25]
  batch_size: 50
  max_items: null
  seed: 1234
  prompts: null
