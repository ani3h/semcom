[project]
name = "semcom"
version = "0.1.0"
description = "Modality-agnostic semantic communication evaluation metric research codebase"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchaudio>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "datasets>=2.18",
    "soundfile>=0.12",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]
train = ["sacrebleu>=2.4", "pystoi>=0.4", "torchmetrics>=1.3", "pesq>=0.0.4", "transformers>=4.45"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires network access / dataset download (skipped by default, run with --run-slow)",
]
